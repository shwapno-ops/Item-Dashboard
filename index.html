<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Shwapno Item Performance Dashboard for Regional, Zonal, Outlet, Category and SKU performance analysis.">
  <title>Shwapno Item Performance Dashboard</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=polished-searchable-filters-20260808-v4">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Dashboard navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div><strong>Shwapno</strong><span>Item Dashboard</span></div>
      </div>
      <nav id="nav" class="nav" aria-label="Dashboard pages"></nav>
      <div class="sidebar-foot">
        <div id="dataStamp">Loading data…</div>
        <button id="refreshData" class="btn btn-ghost btn-full" type="button">Refresh dashboard</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations analytics</p>
          <h1 id="pageTitle">Executive Summary</h1>
          <p id="pageSubtitle" class="subtitle"></p>
        </div>
        <div class="top-actions">
          <button id="clearFilters" class="btn btn-secondary" type="button">Clear filters</button>
          <button id="exportCurrent" class="btn btn-primary" type="button">Export current table</button>
        </div>
      </header>

      <section id="filterBar" class="filter-bar" aria-label="Dashboard filters"></section>

      <section id="content" class="content" aria-live="polite">
        <div class="loading-card">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading processed dashboard data…</p>
        </div>
      </section>
    </main>
  </div>

  <div id="filterPopover" class="filter-popover" hidden></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <!-- Existing dashboard engine: calculations, tables, export and hierarchy logic. -->
  <script src="assets/js/app.js?v=polished-searchable-filters-20260808-v4" defer></script>
  <!-- Integrated UX controller: searchable dashboard filters. -->
  <script src="assets/js/searchable-filters.js?v=polished-searchable-filters-20260808-v4" defer></script>
</body>
</html>
