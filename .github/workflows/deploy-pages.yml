name: Refresh dashboard and deploy Pages

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "data/config.json"
      - "data/drive_source.json"
      - "data/master/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: item-dashboard-pages
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project package
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "index.html"
            "assets/css/styles.css"
            "assets/js/app.js"
            "scripts/preflight.py"
            "scripts/download_drive_data.py"
            "scripts/build_data.py"
            "scripts/validate_build.py"
            "data/config.json"
            "data/drive_source.json"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required project file is missing: $file"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 2
          fi
          echo "All required project files are present."

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check "gdown==6.1.0"

      - name: Preflight source files
        run: python scripts/preflight.py

      - name: Download performance workbooks
        run: python scripts/download_drive_data.py

      - name: Build dashboard data
        run: python scripts/build_data.py

      - name: Validate hierarchy and calculations
        run: python scripts/validate_build.py

      - name: Prepare static Pages artifact
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -R assets processed site/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
